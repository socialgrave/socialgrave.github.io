<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deaxh // archive</title>

<style>
  @import url('https://googleapis.com');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background-color: #000000;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Фоновый SVG-шум под ч/б аватарку */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org width='100%25' height='100%25' fill='none'/%3e%3cfilter id='noise'%3e%3cfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3e%3c/svg%3e");
    pointer-events: none;
    z-index: 10;
  }

  /* Едва заметные полосы терминала */
  .scanlines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 11;
    pointer-events: none;
  }

  .container {
    max-width: 600px;
    width: 90%;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 25px;
    z-index: 5;
  }

  .header {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ffffff;
    opacity: 0.9;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 15px;
  }

  .system-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .status {
    font-size: 11px;
    color: #888888;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 4px;
    background-color: #ffffff;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  /* Строка с тикающим временем и номером сессии */
  .live-data {
    font-size: 11px;
    color: #555555;
    letter-spacing: 0.5px;
  }

  #text {
    font-size: 18px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    color: #e0e0e0;
    min-height: 60px;
    white-space: pre-wrap;
    margin-top: 5px;
  }

  .cursor {
    display: inline-block;
    font-weight: 400;
    animation: blink 0.8s infinite;
    color: #ffffff;
  }

  .links {
    display: flex;
    gap: 20px;
    margin-top: 5px;
    opacity: 0;
    animation: fadeIn 1s forwards;
    animation-delay: 1.2s;
  }

  .links a {
    color: #888888;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
    transition: color 0.3s ease;
  }

  .links a:hover {
    color: #ffffff;
  }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="container">
  <div class="header">u n s o n s y</div>
  
  <div class="system-meta">
    <div class="status">system_online // archive_loaded</div>
    <!-- Динамическая строка времени и просмотров -->
    <div class="live-data" id="liveData">load_time // 00:00:00 // active_session: 0001</div>
  </div>
  
  <div id="text"></div>
  
  <div class="links">
    <a href="https://t.me/deaxh" target="_blank">[telegram]</a>
    <a href="https://t.me/myclubtainted" target="_blank">[channel]</a>
  </div>
</div>

<script>
const FORGET_TIME = 1000 * 60 * 60 * 6;

let now = Date.now();
let lastVisit = localStorage.getItem("lastVisit");
let visits = localStorage.getItem("visits");

if (!lastVisit || now - lastVisit > FORGET_TIME) {
    visits = 0;
} else {
    visits = parseInt(visits || 0);
}

visits += 1;

localStorage.setItem("visits", visits);
localStorage.setItem("lastVisit", now);

// Форматируем номер визита в красивый четырехзначный вид (например, 0003)
const formattedVisits = String(visits).padStart(4, '0');

// Функция для обновления тикающих часов в реальном времени
function updateClock() {
  const d = new Date();
  const hrs = String(d.getHours()).padStart(2, '0');
  const mins = String(d.getMinutes()).padStart(2, '0');
  const secs = String(d.getSeconds()).padStart(2, '0');
  document.getElementById("liveData").innerHTML = `local_time // ${hrs}:${mins}:${secs} // session_id: ${formattedVisits}`;
}
setInterval(updateClock, 1000);
updateClock(); // Сразу запускаем при старте

const messages = [
  "what are you looking for?",
  "you've been here before.",
  "still looking?",
  "no new messages.",
  "the conversation ended."
];

let text = messages[Math.min(visits - 1, messages.length - 1)];
let i = 0;
const speed = 55;

function type() {
  if (i < text.length) {
    document.getElementById("text").innerHTML += text[i];
    i++;
    setTimeout(type, speed);
  } else {
    document.getElementById("text").innerHTML += "<span class='cursor'>_</span>";
  }
}

type();
</script>

</body>
</html>
